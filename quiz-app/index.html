<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
        <div class="quiz_box">
            <div class="heading">
                <h1 id="question">Q</h1>
            </div>
            <div class="answers">
                <input class="radio_btn" type="radio" name="a" >
                <label class= "answer" id="a_a">answer a</label>
                <input class="radio_btn" type="radio" name="a" >
                <label class= "answer" id="a_b">answer b</label>
                <input class="radio_btn" type="radio" name="a" >
                <label class= "answer" id="a_c">answer c</label>
                <input class="radio_btn" type="radio" name="a" >
                <label class= "answer" id="a_d">answer d</label>
            </div>
        </div>
        <button id="submit_button" type="submit">Submit</button>
        
    </div>
</body>
</html>
