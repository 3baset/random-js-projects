<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Timer</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
        <div class="headLine"><h1>Till 25 years Old</h1></div>
        <div class="timer">
            <div class="timerEl">
                <h2 id="years">0</h2>
                <span>Years</span>
            </div>
            <div class="timerEl">
                <h2 id="months">0</h2>
                <span>Months</span>
            </div>
            <div class="timerEl">
                <h2 id="days">0</h2>
                <span>Days</span>
            </div>
            <div class="timerEl">
                <h2 id="hours">0</h2>
                <span>Hours</span>
            </div>
            <div class="timerEl">
                <h2 id="minutes">0</h2>
                <span>Minutes</span>
            </div>
            <div class="timerEl">
                <h2 id="seconds">0</h2>
                <span>Seconds</span>
            </div>
        </div>
    </div>
</body>
</html>
